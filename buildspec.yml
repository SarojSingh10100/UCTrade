version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running migrations check"
      - python manage.py makemigrations --check --dry-run

  build:
    commands:
      - python manage.py test

  post_build:
    commands:
      - echo "Build completed"
